<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭用電儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg:#eef1f4; --panel:#ffffff; --panel2:#f5f7f9; --ink:#101920; --ink2:#36424c; --muted:#5b6771; --line:#d3dae0;
    --accent:#c4570f; --accent-ink:#ffffff; --chip:#e5eaee; --live:#1f7a45; --warn:#9a5b00; --bad:#b42318;
    --grid:#e3e6e9; --axis:#b5bcc2;
    --c-load:#1d63c7; --c-solar:#946000; --c-buy:#c2410c; --c-sell:#15803d;
    --s-load:#2a78d6; --s-solar:#e0a100; --s-buy:#eb6834; --s-sell:#1baf7a;
    --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --font-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0c1115; --panel:#151d24; --panel2:#1b252d; --ink:#f3f6f8; --ink2:#cdd6dc; --muted:#a1adb6; --line:#2a3640;
      --accent:#f08a3e; --accent-ink:#1b1206; --chip:#24303a; --live:#4ade80; --warn:#fbbf24; --bad:#f87171;
      --grid:#232e37; --axis:#3d4a55;
      --c-load:#6db5ff; --c-solar:#ffd23f; --c-buy:#ffa24c; --c-sell:#4ade80;
      --s-load:#3d8fe8; --s-solar:#f2c12e; --s-buy:#f07a3a; --s-sell:#2fbf7f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0c1115; --panel:#151d24; --panel2:#1b252d; --ink:#f3f6f8; --ink2:#cdd6dc; --muted:#a1adb6; --line:#2a3640;
    --accent:#f08a3e; --accent-ink:#1b1206; --chip:#24303a; --live:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --grid:#232e37; --axis:#3d4a55;
    --c-load:#6db5ff; --c-solar:#ffd23f; --c-buy:#ffa24c; --c-sell:#4ade80;
    --s-load:#3d8fe8; --s-solar:#f2c12e; --s-buy:#f07a3a; --s-sell:#2fbf7f;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.55; }
  .wrap { max-width:1120px; margin:0 auto; padding-block:28px 56px;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
    display:grid; gap:26px; }
  .back { font-size:14px; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--ink); }
  .num { font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  .c-load { color:var(--c-load); } .c-solar { color:var(--c-solar); } .c-buy { color:var(--c-buy); } .c-sell { color:var(--c-sell); }
  .ok { color:var(--live); } .warn { color:var(--warn); } .bad { color:var(--bad); } .mute { color:var(--muted); }

  /* 標題列 */
  .top { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .top h1 { margin:0; font-size:clamp(26px,4.5vw,36px); font-weight:900; letter-spacing:.02em; line-height:1.2; }
  .top h1 small { display:block; margin-top:4px; font-size:14px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .status { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-size:14px; font-weight:500; white-space:nowrap; }
  .tag b { font-weight:700; }
  .dot::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; margin-right:6px; vertical-align:middle; }

  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { font:inherit; font-size:15px; padding:9px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
  button:hover { filter:brightness(1.06); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msg { font-size:14px; color:var(--muted); }

  section { display:grid; gap:12px; }
  section > h2 { margin:0; font-size:20px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  section > h2 .sub { font-size:14px; font-weight:500; color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; min-width:0; position:relative; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  /* 能源卡片（全屋、各樓層共用） */
  .ecard { display:grid; gap:16px; align-content:start; }
  .ehead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .ehead h3 { margin:0; font-size:28px; font-weight:900; letter-spacing:.02em; line-height:1.1; }
  .ehead h3 small { font-size:15px; font-weight:500; color:var(--muted); margin-left:8px; letter-spacing:0; }
  .ehead .right { display:flex; gap:8px; flex-wrap:wrap; }
  .big3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .big { display:grid; gap:2px; min-width:0; }
  .big .k { font-size:16px; font-weight:700; color:var(--ink2); white-space:nowrap; }
  .big .v { font-size:clamp(30px,4.2vw,44px); font-weight:700; line-height:1.1; letter-spacing:-.02em; white-space:nowrap; }
  .big .v small { font-size:.45em; font-weight:600; margin-left:3px; letter-spacing:0; }
  .big .s { font-size:13px; color:var(--muted); }
  .hero .big .v { font-size:clamp(34px,5vw,52px); }
  .facts { display:grid; gap:10px; border-top:1px solid var(--line); padding-top:14px; }
  .frow { display:grid; grid-template-columns:52px repeat(4,1fr); gap:8px; align-items:baseline; }
  .frow > .when { font-size:14px; font-weight:700; color:var(--ink2); }
  .fact { min-width:0; }
  .fact .k { display:block; font-size:13px; color:var(--muted); line-height:1.3; }
  .fact .v { font-size:19px; font-weight:700; white-space:nowrap; }
  .fact .v small { font-size:12px; font-weight:500; color:var(--muted); margin-left:2px; }
  .share { display:grid; gap:6px; font-size:14px; color:var(--ink2); }
  .share .track { height:10px; background:var(--chip); border-radius:0 5px 5px 0; overflow:hidden; }
  .share .fill { height:100%; background:var(--s-buy); border-radius:0 5px 5px 0; }
  .fnote { font-size:13px; color:var(--muted); margin:0; }

  /* 圖表 */
  .panel h3.ct { margin:0 0 6px; font-size:18px; font-weight:800; }
  .legend { display:flex; gap:18px; flex-wrap:wrap; font-size:14px; color:var(--ink2); font-weight:500; }
  .legend span { display:inline-flex; align-items:center; gap:7px; }
  .legend i { width:14px; height:14px; border-radius:4px; display:inline-block; }
  .chart { width:100%; height:240px; display:block; }
  .chart text { font-family:var(--font-num); font-size:12px; fill:var(--muted); }
  .tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.18);
    padding:9px 12px; font-size:14px; line-height:1.55; min-width:170px; z-index:5; display:none; }
  .tip b { display:block; font-weight:700; margin-bottom:2px; }
  .tip .row { display:flex; justify-content:space-between; gap:14px; }
  .tip .row span:first-child { display:inline-flex; align-items:center; gap:6px; color:var(--ink2); }
  .tip .row span:last-child { font-family:var(--font-num); font-weight:600; }
  .tip i { width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* 電器、表格 */
  .apps { display:grid; gap:12px; }
  .app { display:grid; grid-template-columns:96px 1fr auto; gap:12px; align-items:center; font-size:16px; font-weight:500; }
  .app .track { height:12px; background:var(--chip); border-radius:0 6px 6px 0; overflow:hidden; }
  .app .fill { height:100%; background:var(--s-load); border-radius:0 6px 6px 0; }
  .app .val { font-size:14px; color:var(--muted); text-align:right; min-width:150px; }
  .app .on { color:var(--c-buy); font-weight:700; }
  details summary { cursor:pointer; font-weight:800; font-size:17px; }
  .tablewrap { overflow-x:auto; margin-top:12px; }
  table { border-collapse:collapse; width:100%; font-size:14px; white-space:nowrap; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child, th:last-child, td:last-child { text-align:left; }
  thead tr:first-child th { text-align:center; color:var(--ink); font-weight:800; border-bottom:0; }
  th.sep, td.sep { border-left:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:13px; }
  td { font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  .note { font-size:13px; color:var(--muted); margin:0; }
  @media (max-width:860px) { .pair { grid-template-columns:1fr; } }
  @media (max-width:600px) {
    .panel { padding:14px 14px; border-radius:14px; }
    .ehead h3 { font-size:24px; }
    .big3 { gap:6px; }
    .big .k { font-size:14px; }
    .big .v, .hero .big .v { font-size:clamp(24px,7.4vw,34px); }
    .frow { grid-template-columns:repeat(4,1fr); }
    .frow > .when { grid-column:1 / -1; }
    .fact .v { font-size:16px; }
    .chart { height:210px; }
    .app { grid-template-columns:82px 1fr; }
    .app .val { grid-column:1 / -1; text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://da199919-ux.github.io/portal/">← 網站總覽</a>

  <div class="top">
    <h1>家庭用電儀表板<small>資料來源：AppSheet「家庭管家」· 家庭管家_用電</small></h1>
    <div class="status">
      <span class="tag">資料時間 <b class="num" id="m-time">—</b></span>
      <span class="tag" id="m-mode">快照</span>
      <span class="tag" id="m-status">—</span>
    </div>
  </div>

  <div class="bar">
    <button id="connect" class="primary" type="button">以 Google 連線即時資料</button>
    <button id="refresh" type="button" hidden>重新整理</button>
    <button id="disconnect" type="button" hidden>中斷連線</button>
    <span id="msg" role="status" aria-live="polite">目前顯示離線快照。</span>
  </div>

  <div class="panel ecard hero" id="hero"></div>

  <div class="pair">
    <div class="panel ecard" id="floor-0"></div>
    <div class="panel ecard" id="floor-1"></div>
  </div>

  <section>
    <h2>近 48 小時 <span class="sub">15 分鐘平均 · 兩層同一刻度</span></h2>
    <div class="legend"><span><i style="background:var(--s-load)"></i>🏠 用電</span><span><i style="background:var(--s-solar)"></i>☀️ 發電</span></div>
    <div class="pair">
      <div class="panel" id="p-curve-0"><h3 class="ct">1F 一樓</h3><svg class="chart" id="c-curve-0" role="img" aria-label="一樓近 48 小時用電與發電折線圖"></svg><div class="tip" id="t-curve-0"></div></div>
      <div class="panel" id="p-curve-1"><h3 class="ct">2F+3F 樓上</h3><svg class="chart" id="c-curve-1" role="img" aria-label="樓上近 48 小時用電與發電折線圖"></svg><div class="tip" id="t-curve-1"></div></div>
    </div>
  </section>

  <section>
    <h2>每日電量 <span class="sub">kWh · 兩層同一刻度</span></h2>
    <div class="legend"><span><i style="background:var(--s-buy)"></i>⚡ 買電</span><span><i style="background:var(--s-solar)"></i>☀️ 發電</span><span><i style="background:var(--s-sell)"></i>↩ 賣電</span></div>
    <div class="pair">
      <div class="panel" id="p-daily-0"><h3 class="ct">1F 一樓</h3><svg class="chart" id="c-daily-0" role="img" aria-label="一樓每日買電、發電與賣電長條圖"></svg><div class="tip" id="t-daily-0"></div></div>
      <div class="panel" id="p-daily-1"><h3 class="ct">2F+3F 樓上</h3><svg class="chart" id="c-daily-1" role="img" aria-label="樓上每日買電、發電與賣電長條圖"></svg><div class="tip" id="t-daily-1"></div></div>
    </div>
  </section>

  <section>
    <h2>電器 <span class="sub">插座計量 · 今日用電與即時功率 · 未標示樓層</span></h2>
    <div class="panel"><div class="apps" id="apps"></div></div>
  </section>

  <section class="panel">
    <details>
      <summary>每日彙總表（分樓層）</summary>
      <div class="tablewrap"><table id="table"></table></div>
    </details>
  </section>

  <p class="note" id="foot"></p>
</div>

<script type="module">
import { snapshot as bundled } from './data.js';

// 每日 23:50 由試算表的 Apps Script（dashRefreshSnapshot）更新；讀不到時退回 data.js
const SNAPSHOT_URL = 'https://script.google.com/macros/s/AKfycby5QTVMbTYasAZi7cB_GKAEs7u6MSPEtxzaaPnrsWwmO7RVNAu9VnoEG3sjE1gtlG5ylg/exec';
const SHEET_ID = '1jhZCx9M8pv0hewr7k7Vrh0R_qrxpqztrH9mTusxYUhE';
const FIREBASE = { apiKey:'AIzaSyBjQwfHCw1v6ZkW0w0M-zyo17ANAuFY1IU', authDomain:'html-tool-hub.firebaseapp.com', projectId:'html-tool-hub', appId:'1:42179940085:web:4e9cc9bd9b278abdf0ffbc' };
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets.readonly';
const APPS = ['熱水器','咖啡機','飲水機','廚房熱水器','門口燈','除濕機'];
const FLOORS = ['一樓', '樓上'];
const $ = s => document.querySelector(s);
const fmt = (v, d = 1) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('zh-TW', { maximumFractionDigits:d, minimumFractionDigits:d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const n0 = v => v ?? null;
const add = (a, b) => a == null && b == null ? null : (a || 0) + (b || 0);
let snapshot = bundled, data, timer;

async function loadDailySnapshot() {
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
    const j = await fetch(SNAPSHOT_URL, { signal:ctrl.signal, credentials:'omit' }).then(r => r.ok ? r.json() : null);
    clearTimeout(t);
    if (j && j.latest && Array.isArray(j.daily) && Array.isArray(j.curve)) snapshot = j;
  } catch {}
}

/* ---------- 資料轉換 ----------
   daily 列：[0 日期,1 完整度,2 全屋購電,3 全屋售電,4 太陽能,5 一樓購電,6 樓上購電,7 平均W,8 尖峰W,9 狀態,10-15 電器,
             16 一樓售電,17 樓上售電,18 一樓太陽能,19 樓上太陽能,20 一樓平均W,21 樓上平均W,22 一樓尖峰W,23 樓上尖峰W]
   curve 列：[時間, 全屋負載, 全屋太陽能, 全屋市電, 一樓市電, 一樓太陽能, 樓上市電, 樓上太陽能] */
const floorPoint = (grid, solar) => ({ grid:n0(grid), solar:n0(solar), load:grid == null ? null : add(grid, solar) });
function fromSnapshot(s) {
  const daily = s.daily.map(r => ({ date:r[0], complete:r[1], buy:r[2], sell:r[3], solar:r[4], avgW:r[7], maxW:r[8], status:r[9],
    apps:Object.fromEntries(APPS.map((a, i) => [a, n0(r[10 + i])])),
    f:[{ buy:n0(r[5]), sell:n0(r[16]), solar:n0(r[18]), avgW:n0(r[20]), maxW:n0(r[22]) },
       { buy:n0(r[6]), sell:n0(r[17]), solar:n0(r[19]), avgW:n0(r[21]), maxW:n0(r[23]) }] }));
  const year = s.generatedAt.slice(0, 4);
  const curve = s.curve.map(r => ({ t:toMs(`${year}-${r[0]}`), load:r[1], solar:r[2], grid:r[3], f:[floorPoint(r[4], r[5]), floorPoint(r[6], r[7])] }));
  const L = s.latest;
  return { mode:'snapshot', daily, curve, latest:{ ...L, appliances:L.appliances.map(([name, w, kwh]) => ({ name, w, kwh })),
    f:[{ ...floorPoint(L.grid1W, L.solar1W), solarTime:L.growatt1Time }, { ...floorPoint(L.grid2W, L.solar2W), solarTime:L.growatt2Time }] } };
}
function toMs(text) {
  const m = String(text).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\D+(\d{1,2}):(\d{2})/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]).getTime() : NaN;
}
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; };
function isoDate(text) { const m = String(text).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : String(text); }

function fromSheets(dailyRows, snapRows) {
  const objs = rows => { const [h, ...rest] = rows; return rest.filter(r => r.some(c => c !== '')).map(r => Object.fromEntries(h.map((k, i) => [k, r[i] ?? '']))); };
  const fl = (r, p) => ({ buy:num(r[p + '購電kWh']), sell:num(r[p + '售電kWh']), solar:num(r[p + '太陽能kWh']), avgW:num(r[p + '平均負載W']), maxW:num(r[p + '最大負載W']) });
  const daily = objs(dailyRows).map(r => ({ date:isoDate(r['日期']), complete:num(r['完整度%']), buy:num(r['全屋購電kWh']), sell:num(r['全屋售電kWh']), solar:num(r['太陽能發電kWh']),
    avgW:num(r['平均負載W']), maxW:num(r['最大負載W']), status:r['彙總狀態'],
    apps:Object.fromEntries(APPS.map(a => [a, num(r[a + '用電kWh'])])), f:FLOORS.map(p => fl(r, p)) })).sort((a, b) => a.date.localeCompare(b.date));
  const snaps = objs(snapRows).map(r => ({ r, t:toMs(r['時段']) })).filter(x => !isNaN(x.t) && num(x.r['全屋負載W']) != null).sort((a, b) => a.t - b.t);
  if (!snaps.length) throw new Error('用電快照沒有可用資料。');
  const last = snaps[snaps.length - 1], from = last.t - 48 * 3600e3, buckets = new Map();
  const cols = ['全屋負載W','全屋太陽能W','全屋市電W','一樓市電W','一樓太陽能W','樓上市電W','樓上太陽能W'];
  for (const { r, t } of snaps) {
    if (t <= from) continue;
    const k = Math.floor(t / 900e3) * 900e3, b = buckets.get(k) || cols.map(() => []);
    cols.forEach((c, i) => { const v = num(r[c]); if (v != null) b[i].push(v); });
    buckets.set(k, b);
  }
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
  const curve = [...buckets].sort((a, b) => a[0] - b[0]).map(([t, b]) => { const v = b.map(avg);
    return { t, load:v[0], solar:v[1], grid:v[2], f:[floorPoint(v[3], v[4]), floorPoint(v[5], v[6])] }; });
  const L = last.r;
  return { mode:'live', daily, curve, latest:{ time:L['時段'], status:L['資料狀態'], tuya:L['Tuya狀態'], growatt:L['Growatt狀態'], worker:L['Worker版本'], error:L['錯誤訊息'],
    loadW:num(L['全屋負載W']), solarW:num(L['全屋太陽能W']), gridW:num(L['全屋市電W']),
    f:[{ ...floorPoint(num(L['一樓市電W']), num(L['一樓太陽能W'])), solarTime:L['Growatt一樓資料時間'] },
       { ...floorPoint(num(L['樓上市電W']), num(L['樓上太陽能W'])), solarTime:L['Growatt樓上資料時間'] }],

/* ---------- Google 即時資料 ---------- */
let fb;
async function firebase() {
  if (fb) return fb;
  const [app, a] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js')
  ]);
  const auth = a.getAuth(app.initializeApp(FIREBASE));
  await a.setPersistence(auth, a.browserSessionPersistence);
  return fb = { a, auth };
}
function savedToken() { try { const t = JSON.parse(sessionStorage.getItem('power-token') || 'null'); return t && t.exp > Date.now() + 60e3 ? t.token : null; } catch { return null; } }
function saveToken(token) { try { sessionStorage.setItem('power-token', JSON.stringify({ token, exp:Date.now() + 55 * 60e3 })); } catch {} }
function clearToken() { try { sessionStorage.removeItem('power-token'); } catch {} }
async function signIn() {
  const { a, auth } = await firebase();
  const provider = new a.GoogleAuthProvider();
  provider.addScope(SCOPE);
  provider.setCustomParameters({ prompt:'select_account' });
  const result = await a.signInWithPopup(auth, provider);
  const token = a.GoogleAuthProvider.credentialFromResult(result)?.accessToken;
  if (!token) throw new Error('Google 沒有回傳試算表授權。');
  saveToken(token);
  return token;
}
async function api(token, path) {
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}${path}`, { headers:{ Authorization:'Bearer ' + token } });
  if (res.status === 401) { clearToken(); throw Object.assign(new Error('授權已過期，請重新連線。'), { expired:true }); }
  if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error?.message || `Google Sheets 回應 ${res.status}`); }
  return res.json();
}
const vals = (token, range) => api(token, `/values/${encodeURIComponent(range)}`).then(j => j.values || []);
async function loadLive(token) {
  const meta = await api(token, '?fields=sheets.properties(title,gridProperties.rowCount)');
  const rc = meta.sheets.find(s => s.properties.title === '用電快照')?.properties.gridProperties.rowCount || 1000;
  const [dailyRows, head, tail] = await Promise.all([
    vals(token, '用電每日彙總!A1:AZ'),
    vals(token, '用電快照!A1:AZ1'),
    vals(token, `用電快照!A${Math.max(2, rc - 800)}:AZ${rc}`)
  ]);
  let rows = tail;
  if (rows.filter(r => r.length).length < 50 && rc > 800) rows = (await vals(token, '用電快照!A2:AZ')).slice(-800);
  return fromSheets(dailyRows, [head[0], ...rows]);
}
async function goLive(interactive) {
  const msg = $('#msg');
  try {
    let token = savedToken();
    if (!token) { if (!interactive) return; msg.textContent = '請在彈出視窗選擇有權限的 Google 帳號…'; token = await signIn(); }
    msg.textContent = '讀取 Google 試算表中…';
    data = await loadLive(token);
    render();
    msg.textContent = `已連線即時資料，每 5 分鐘自動更新（最後讀取 ${new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' })}）。`;
    $('#connect').hidden = true; $('#refresh').hidden = false; $('#disconnect').hidden = false;
    clearInterval(timer); timer = setInterval(() => goLive(false), 5 * 60e3);
  } catch (e) {
    const code = e.code || '';
    msg.textContent = code.includes('popup') ? '登入視窗未完成，請允許彈出視窗後再試一次。'
      : code.includes('unauthorized-domain') ? '此網域尚未加入 Firebase 授權網域。'
      : /has not been used|disabled/i.test(e.message) ? 'Google Sheets API 尚未在 html-tool-hub 專案啟用，請先啟用後再試。'
      : /permission|caller does not have/i.test(e.message) ? '這個 Google 帳號沒有這份試算表的檢視權限。'
      : e.message;
    if (e.expired) { $('#connect').hidden = false; $('#refresh').hidden = true; clearInterval(timer); }
  }
}
$('#connect').onclick = () => goLive(true);
$('#refresh').onclick = () => goLive(false).then(() => { if (!savedToken()) goLive(true); });
$('#disconnect').onclick = async () => {
  clearInterval(timer); clearToken();
  try { const { a, auth } = await firebase(); await a.signOut(auth); } catch {}
  data = fromSnapshot(snapshot); render();
  $('#connect').hidden = false; $('#refresh').hidden = true; $('#disconnect').hidden = true;
  $('#msg').textContent = `已中斷連線，目前顯示每日快照（${snapshot.generatedAt}）。`;
};

/* ---------- 畫面 ---------- */
function statusClass(s) { return s === 'ok' ? 'ok' : s === 'partial' || s === 'stale' || s === 'sleep' ? 'warn' : 'bad'; }
// 功率：1000 W 以上改用 kW
function pw(v) {
  if (v == null || isNaN(v)) return ['—', ''];
  const a = Math.abs(v);
  return a >= 1000 ? [(a / 1000).toFixed(a >= 10000 ? 1 : 2), 'kW'] : [String(Math.round(a)), 'W'];
}
const used = f => f.buy == null && f.solar == null ? null : (f.buy || 0) + (f.solar || 0) - (f.sell || 0);   // 用電 = 買電 + 發電 − 賣電
const selfRate = f => { const u = used(f); return u > 0 ? Math.max(0, Math.min(100, ((f.solar || 0) - (f.sell || 0)) / u * 100)) : null; };
const bigHtml = (icon, k, v, cls, sub = '') => { const [n, u] = Array.isArray(v) ? v : [v, '']; return `<div class="big"><span class="k">${icon} ${k}</span><span class="v num ${cls}">${n}<small>${u}</small></span>${sub ? `<span class="s">${sub}</span>` : ''}</div>`; };
const factHtml = (k, v, cls, unit = 'kWh') => `<div class="fact"><span class="k">${k}</span><span class="v num ${cls}">${v}<small>${unit}</small></span></div>`;
function gridTag(g) {
  if (g == null) return '';

}
function factRows(td, m, monthLabel, days) {
  return `<div class="facts">
    <div class="frow"><span class="when">今日</span>${factHtml('☀️ 發電', fmt(td.solar, 1), 'c-solar')}${factHtml('🏠 用電', fmt(used(td), 1), 'c-load')}${factHtml('⚡ 買電', fmt(td.buy, 2), 'c-buy')}${factHtml('↩ 賣電', fmt(td.sell, 2), 'c-sell')}</div>
    <div class="frow"><span class="when">${monthLabel}</span>${factHtml('☀️ 發電', fmt(m.solar, 1), 'c-solar')}${factHtml('🏠 用電', fmt(used(m), 1), 'c-load')}${factHtml('⚡ 買電', fmt(m.buy, 1), 'c-buy')}${factHtml('↩ 賣電', fmt(m.sell, 1), 'c-sell')}</div>
  </div>`;
}

function render() {

      ${bigHtml(selling ? '↩' : '⚡', selling ? '賣電' : '買電', pw(L.gridW), selling ? 'c-sell' : 'c-buy', selling ? '多的電回送台電' : '由台電供應')}

    : `每日快照（${snapshot.generatedAt} 產生，每天 23:50 自動更新）。按「以 Google 連線即時資料」並用有試算表權限的帳號登入，即可讀取最新資料。`)

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const s = v / p > 5 ? 2 : 1; return Math.ceil(v / p / s) * p * s; }
function frame(svg) { const w = svg.clientWidth || 500, h = svg.clientHeight || 240; svg.setAttribute('viewBox', `0 0 ${w} ${h}`); return { w, h, m:{ l:46, r:10, t:10, b:28 } }; }
function yAxis(w, h, m, max, unit) {
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = h - m.b - (h - m.t - m.b) * i / 4;
    s += `<line x1="${m.l}" x2="${w - m.r}" y1="${y}" y2="${y}" stroke="${i ? css('--grid') : css('--axis')}" stroke-width="1"/>`;
    s += `<text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${unit(v)}</text>`; }
  return s;
}
function placeTip(tip, panel, x, y) {
  tip.style.display = 'block';
  const pw = panel.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(8, x + 14), pw - tw - 8) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const rowHtml = (color, name, val) => `<div class="row"><span>${color ? `<i style="background:${color}"></i>` : ''}${name}</span><span class="num">${val}</span></div>`;
const kW = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : String(Math.round(v));

function drawCharts() {
  const pts = data.curve.filter(p => !isNaN(p.t));
  const cMax = niceMax(Math.max(1, ...pts.flatMap(p => p.f.flatMap(f => [f.load || 0, f.solar || 0]))));
  const dMax = niceMax(Math.max(1, ...data.daily.flatMap(d => d.f.flatMap(f => [f.buy || 0, f.solar || 0, f.sell || 0]))));
  [0, 1].forEach(i => {
    drawLine(i, pts.map(p => ({ t:p.t, ...p.f[i] })), cMax);
    drawBars(i, data.daily.map(d => ({ date:d.date, status:d.status, ...d.f[i] })), dMax);
  });
}

function drawLine(i, all, max) {
  const svg = $(`#c-curve-${i}`), tip = $(`#t-curve-${i}`), panel = $(`#p-curve-${i}`), pts = all.filter(p => p.load != null);
  const { w, h, m } = frame(svg);
  if (!pts.length) { svg.innerHTML = `<text x="${w / 2}" y="${h / 2}" text-anchor="middle">沒有資料</text>`; return; }
  const t0 = all[0].t, t1 = all[all.length - 1].t;
  const X = t => m.l + (w - m.l - m.r) * (t - t0) / Math.max(1, t1 - t0), Y = v => h - m.b - (h - m.t - m.b) * v / max;
  const path = key => { let d = '', prev; for (const p of pts) { if (p[key] == null) { prev = null; continue; } d += (prev && p.t - prev.t <= 45 * 60e3 ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p[key]).toFixed(1); prev = p; } return d; };
  let s = yAxis(w, h, m, max, kW);
  const step = (w < 420 ? 12 : 6) * 3600e3;
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) { const d = new Date(t);
    s += `<text x="${X(t)}" y="${h - 8}" text-anchor="middle">${d.getHours() === 0 ? (d.getMonth() + 1) + '/' + d.getDate() : String(d.getHours()).padStart(2, '0') + ':00'}</text>`; }
  s += `<path d="${path('solar')}" fill="none" stroke="${css('--s-solar')}" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<path d="${path('load')}" fill="none" stroke="${css('--s-load')}" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<g class="cross" style="display:none"><line y1="${m.t}" y2="${h - m.b}" stroke="${css('--axis')}" stroke-dasharray="3 3"/>
    <circle r="4.5" fill="${css('--s-load')}" stroke="${css('--panel')}" stroke-width="2" data-k="load"/><circle r="4.5" fill="${css('--s-solar')}" stroke="${css('--panel')}" stroke-width="2" data-k="solar"/></g>`;
  s += `<rect class="hit" x="${m.l}" y="${m.t}" width="${w - m.l - m.r}" height="${h - m.t - m.b}" fill="transparent"/>`;
  svg.innerHTML = s;
  const cross = svg.querySelector('.cross'), line = cross.querySelector('line');
  const move = e => {
    const r = svg.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const t = t0 + (x - m.l) / (w - m.l - m.r) * (t1 - t0);
    let p = pts[0]; for (const q of pts) if (Math.abs(q.t - t) < Math.abs(p.t - t)) p = q;
    cross.style.display = ''; line.setAttribute('x1', X(p.t)); line.setAttribute('x2', X(p.t));
    for (const c of cross.querySelectorAll('circle')) { const v = p[c.dataset.k]; c.style.display = v == null ? 'none' : ''; c.setAttribute('cx', X(p.t)); c.setAttribute('cy', Y(v || 0)); }
    const d = new Date(p.t);
    tip.innerHTML = `<b>${FLOORS[i]} · ${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</b>`
      + rowHtml(css('--s-load'), '🏠 用電', pw(p.load).join(' ')) + rowHtml(css('--s-solar'), '☀️ 發電', pw(p.solar).join(' '))
      + rowHtml('', p.grid < 0 ? '↩ 賣電' : '⚡ 買電', pw(p.grid).join(' '));
    placeTip(tip, panel, X(p.t) + svg.offsetLeft, svg.offsetTop + 10);
  };
  const hit = svg.querySelector('.hit');
  hit.onmousemove = move; hit.ontouchstart = hit.ontouchmove = move;
  hit.onmouseleave = () => { cross.style.display = 'none'; tip.style.display = 'none'; };
}

function roundTop(x, y, bw, bh) { const r = Math.min(4, bw / 2, bh); if (bh <= 0) return ''; return `M${x} ${y + bh}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + bw - r}Q${x + bw} ${y} ${x + bw} ${y + r}V${y + bh}Z`; }
function drawBars(i, days, max) {
  const svg = $(`#c-daily-${i}`), tip = $(`#t-daily-${i}`), panel = $(`#p-daily-${i}`);
  const { w, h, m } = frame(svg);
  const keys = [['buy', '--s-buy', '⚡ 買電'], ['solar', '--s-solar', '☀️ 發電'], ['sell', '--s-sell', '↩ 賣電']];
  const band = (w - m.l - m.r) / Math.max(1, days.length), gap = 2, bw = Math.max(1.5, (band * 0.8 - gap * 2) / 3);
  const Y = v => h - m.b - (h - m.t - m.b) * v / max;
  let s = yAxis(w, h, m, max, v => Math.round(v));
  const every = Math.ceil(days.length / Math.max(1, Math.floor((w - m.l) / 44)));
  days.forEach((d, j) => {
    const x0 = m.l + band * j + (band - (bw * 3 + gap * 2)) / 2;
    keys.forEach(([k, c], q) => { const v = d[k] || 0; s += `<path d="${roundTop(x0 + q * (bw + gap), Y(v), bw, h - m.b - Y(v))}" fill="${css(c)}" opacity="${d.status === '完整' ? 1 : .55}"/>`; });
    if (j % every === 0 || j === days.length - 1) s += `<text x="${m.l + band * j + band / 2}" y="${h - 8}" text-anchor="middle">${+d.date.slice(5, 7)}/${+d.date.slice(8)}</text>`;
    s += `<rect x="${m.l + band * j}" y="${m.t}" width="${band}" height="${h - m.t - m.b}" fill="transparent" data-j="${j}" class="hit"/>`;
  });
  svg.innerHTML = s;
  const show = e => {
    const el = e.target.closest('.hit'); if (!el) return;
    const d = days[+el.dataset.j];
    svg.querySelectorAll('.hit').forEach(r => r.setAttribute('fill', 'transparent')); el.setAttribute('fill', css('--chip')); el.setAttribute('fill-opacity', '.5');
    tip.innerHTML = `<b>${FLOORS[i]} · ${d.date}${d.status && d.status !== '完整' ? '（' + esc(d.status) + '）' : ''}</b>` + keys.map(([k, c, n]) => rowHtml(css(c), n, fmt(d[k], 2) + ' kWh')).join('')
      + rowHtml(css('--s-load'), '🏠 用電', fmt(used(d), 2) + ' kWh') + rowHtml('', '尖峰', pw(d.maxW).join(' '));
    placeTip(tip, panel, +el.getAttribute('x') + band / 2 + svg.offsetLeft, svg.offsetTop + 10);
  };
  svg.onmousemove = show; svg.ontouchstart = show;
  svg.onmouseleave = () => { tip.style.display = 'none'; svg.querySelectorAll('.hit').forEach(r => r.setAttribute('fill', 'transparent')); };
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawCharts, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', drawCharts);
